version: 2

models:
  - name: dim_date
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: dim_triage_category
    columns:
      - name: triage_category
        data_tests: [unique, not_null]

  - name: fact_staff_roster
    columns:
      - name: shift_id
        data_tests: [unique, not_null]
      - name: facility_id
        data_tests:
          - relationships:
              to: ref('dim_facility')
              field: facility_id
      - name: department_id
        data_tests:
          - relationships:
              to: ref('dim_department')
              field: department_id
      - name: shift_status
        data_tests:
          - accepted_values:
              values: ['ABSENT', 'AGENCY', 'COMPLETED']

  - name: fact_department_target
    columns:
      - name: department_id
        data_tests:
          - not_null
          - relationships:
              to: ref('dim_department')
              field: department_id

  - name: fact_patient_transfer
    columns:
      - name: transfer_id
        data_tests: [unique, not_null]
      - name: from_facility_id
        data_tests: [not_null]

  - name: fact_diagnosis
    columns:
      - name: diagnosis_id
        data_tests: [unique, not_null]
      - name: facility_id
        data_tests: [not_null]

  - name: fact_procedure
    columns:
      - name: procedure_id
        data_tests: [unique, not_null]

  - name: fact_ed_triage
    columns:
      - name: encounter_id
        data_tests: [unique, not_null]
      - name: is_seen_within_target
        data_tests:
          - accepted_values:
              values: [0, 1]
