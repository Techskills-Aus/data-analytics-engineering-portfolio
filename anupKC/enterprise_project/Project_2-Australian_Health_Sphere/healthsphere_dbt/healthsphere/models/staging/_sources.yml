version: 2

sources:
  - name: raw
    database: AUSTRALIAN_HEALTHSPHERE
    schema: RAW
    config:
      loaded_at_field: ingestion_timestamp
      freshness:
        warn_after: { count: 26, period: hour }
        error_after: { count: 50, period: hour }
    tables:
      - name: raw_admission
      - name: raw_bed
      - name: raw_department
      - name: raw_department_target
        config:
          freshness: null
      - name: raw_diagnosis
      - name: raw_discharge
      - name: raw_encounter
      - name: raw_facility
      - name: raw_patient
      - name: raw_patient_transfer
      - name: raw_procedure
      - name: raw_staff_roster
        config:
          freshness: null
      - name: raw_ward_capacity
        config:
          freshness: null
